<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Bitcoin Price</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#0b1020; color:#e6eef8 }
      .card { background:#0f1724; padding:32px 40px; border-radius:12px; box-shadow:0 6px 24px rgba(2,6,23,.6); text-align:center; max-width:400px; width:100% }
      h1 { font-size:24px; margin:0 0 24px 0; font-weight:600 }
      form { display:flex; flex-direction:column; gap:16px }
      input[type="password"] { padding:12px 16px; border-radius:8px; border:1px solid #2d3748; background:#1a202c; color:#e6eef8; font-size:16px; outline:none; transition:border-color .2s }
      input[type="password"]:focus { border-color:#4299e1 }
      button { padding:12px 24px; border-radius:8px; border:none; background:#4299e1; color:white; font-size:16px; font-weight:500; cursor:pointer; transition:background .2s }
      button:hover { background:#3182ce }
      .error { color:#fc8181; margin-top:8px; font-size:14px }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Enter Password</h1>
      <form method="POST" action="/login">
        <input type="password" name="password" placeholder="Enter password" required autofocus />
        <button type="submit">Login</button>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
      </form>
    </div>
  </body>
</html>
