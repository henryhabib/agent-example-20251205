<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitcoin Price — Real-time</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#0b1020; color:#e6eef8 }
      .card { background:#0f1724; padding:24px 28px; border-radius:12px; box-shadow:0 6px 24px rgba(2,6,23,.6); text-align:center }
      .price { font-size:48px; font-weight:700; margin:8px 0 }
      .meta { font-size:14px; color:#9fb0d4 }
      #password-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(11,16,32,0.95); display:flex; align-items:center; justify-content:center; z-index:1000 }
      #password-overlay.hidden { display:none }
      .password-card { background:#0f1724; padding:32px; border-radius:12px; box-shadow:0 6px 24px rgba(2,6,23,.6); text-align:center; max-width:320px }
      .password-card h2 { margin:0 0 16px; font-size:24px }
      .password-card input { width:100%; padding:12px; margin:12px 0; border:1px solid #2d3748; border-radius:6px; background:#1a202c; color:#e6eef8; font-size:16px; box-sizing:border-box }
      .password-card button { width:100%; padding:12px; background:#3b82f6; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer; font-weight:600 }
      .password-card button:hover { background:#2563eb }
      .error-msg { color:#ef4444; font-size:14px; margin-top:8px; min-height:20px }
    </style>
  </head>
  <body>
    <div id="password-overlay">
      <div class="password-card">
        <h2>Enter Password</h2>
        <p>Please enter the password to view Bitcoin price</p>
        <input type="password" id="password-input" placeholder="Password" aria-label="Password input" />
        <button id="submit-password" aria-label="Submit password">Submit</button>
        <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>
      </div>
    </div>

    <div class="card">
      <div>Bitcoin (BTC)</div>
      <div id="price" class="price">—</div>
      <div id="meta" class="meta">connecting…</div>
    </div>

    <script>
      const priceEl = document.getElementById('price')
      const metaEl = document.getElementById('meta')
      const passwordOverlay = document.getElementById('password-overlay')
      const passwordInput = document.getElementById('password-input')
      const submitButton = document.getElementById('submit-password')
      const errorMsg = document.getElementById('error-msg')
      let eventSource = null

      function fmtPrice(p) {
        if (p === null || p === undefined) return '—'
        return '$' + Number(p).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})
      }

      function startStreaming() {
        eventSource = new EventSource('/stream')
        eventSource.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data)
            priceEl.textContent = fmtPrice(data.price)
            if (data.time) {
              const d = new Date(data.time * 1000)
              metaEl.textContent = 'updated ' + d.toLocaleTimeString()
            } else {
              metaEl.textContent = 'waiting for first price…'
            }
          } catch (err) {
            metaEl.textContent = 'error parsing data'
          }
        }
        eventSource.onerror = () => { metaEl.textContent = 'connection lost, retrying…' }
      }

      async function verifyPassword() {
        const password = passwordInput.value
        errorMsg.textContent = ''
        
        try {
          const response = await fetch('/verify_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          })
          const result = await response.json()
          
          if (result.success) {
            passwordOverlay.classList.add('hidden')
            startStreaming()
          } else {
            errorMsg.textContent = 'Incorrect password. Please try again.'
            passwordInput.value = ''
            passwordInput.focus()
          }
        } catch (err) {
          errorMsg.textContent = 'Error verifying password. Please try again.'
        }
      }

      submitButton.addEventListener('click', verifyPassword)
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') verifyPassword()
      })

      // Focus on password input when page loads
      passwordInput.focus()
    </script>
  </body>
</html>
