<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitcoin Price — Real-time</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#0b1020; color:#e6eef8 }
      .card { background:#0f1724; padding:24px 28px; border-radius:12px; box-shadow:0 6px 24px rgba(2,6,23,.6); text-align:center }
      .price { font-size:48px; font-weight:700; margin:8px 0 }
      .meta { font-size:14px; color:#9fb0d4 }
      .alert { position:fixed; top:20px; right:20px; background:#48bb78; color:white; padding:16px 24px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.3); font-weight:500; animation:slideIn .3s ease-out }
      @keyframes slideIn { from { transform:translateX(100%); opacity:0 } to { transform:translateX(0); opacity:1 } }
    </style>
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert" id="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <div class="card">
      <div>Bitcoin (BTC)</div>
      <div id="price" class="price">—</div>
      <div id="meta" class="meta">connecting…</div>
    </div>

    <script>
      // Auto-hide alert after 3 seconds
      const alertEl = document.getElementById('alert')
      if (alertEl) {
        setTimeout(() => {
          alertEl.style.animation = 'slideIn .3s ease-out reverse'
          setTimeout(() => alertEl.remove(), 300)
        }, 3000)
      }

      const priceEl = document.getElementById('price')
      const metaEl = document.getElementById('meta')

      function fmtPrice(p) {
        if (p === null || p === undefined) return '—'
        return '$' + Number(p).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})
      }

      const es = new EventSource('/stream')
      es.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data)
          priceEl.textContent = fmtPrice(data.price)
          if (data.time) {
            const d = new Date(data.time * 1000)
            metaEl.textContent = 'updated ' + d.toLocaleTimeString()
          } else {
            metaEl.textContent = 'waiting for first price…'
          }
        } catch (err) {
          metaEl.textContent = 'error parsing data'
        }
      }
      es.onerror = () => { metaEl.textContent = 'connection lost, retrying…' }
    </script>
  </body>
</html>
